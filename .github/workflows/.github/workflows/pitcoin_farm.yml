name: Auto Pitcoin Mines 3-Bom

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

jobs:
  run-mines:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests telethon colorama

      - name: Chay Mini Game Mines 3 Bom Lien Tuc
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
          TELEGRAM_STRING_SESSION_ACC1: ${{ secrets.TELEGRAM_STRING_SESSION_ACC1 }}
          TELEGRAM_STRING_SESSION_ACC2: ${{ secrets.TELEGRAM_STRING_SESSION_ACC2 }}
          TELEGRAM_STRING_SESSION_ACC3: ${{ secrets.TELEGRAM_STRING_SESSION_ACC3 }}
          TELEGRAM_STRING_SESSION_ACC4: ${{ secrets.TELEGRAM_STRING_SESSION_ACC4 }}
          TELEGRAM_STRING_SESSION_ACC5: ${{ secrets.TELEGRAM_STRING_SESSION_ACC5 }}
        run: |
          python auto_mines_3bom.py
